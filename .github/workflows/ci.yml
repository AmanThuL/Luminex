name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  # Classifies the change so documentation-only pull requests do not wait for the macOS build.
  # `code` is true when any changed file lies outside the documentation list, so the filter fails
  # closed: an unlisted path always runs the full build. `build-test` keeps its name because branch
  # protection requires that context; a job skipped by its `if` reports "skipped", which GitHub
  # treats as satisfied for required checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file matches only when it satisfies every pattern: any path, and not documentation.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!LICENSE'

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Project policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args=(--commits "$PR_BASE..$PR_HEAD")
          elif [[ -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            if git merge-base --is-ancestor "$PUSH_BASE" HEAD 2>/dev/null; then
              args=(--commits "$PUSH_BASE..HEAD")
            elif common_base=$(git merge-base "$PUSH_BASE" HEAD 2>/dev/null); then
              args=(--commits "$common_base..HEAD")
            else
              args=(--commits HEAD)
            fi
          fi
          python3 Tools/check_project_policy.py "${args[@]}"

      - name: Shader import policy
        run: python3 Tools/check_shader_imports.py

      - name: Policy checker tests
        run: python3 -m unittest discover -s Tools/tests -v

      - name: RojoRHI policy checker tests
        run: python3 -m unittest discover -s RojoRHI/Tools/tests -t RojoRHI -v

      - name: RojoRHI project policy
        run: python3 RojoRHI/Tools/check_project_policy.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install temporal comparison dependencies
        run: python3 -m pip install -r Tools/TemporalCompare/requirements.txt

      - name: Temporal comparison report tests
        run: python3 -m unittest discover -s Tools/TemporalCompare -v

  build-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install xmake and clang-format
        run: brew install xmake clang-format

      - name: Cache ThirdParty
        uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake.lua', 'xmake/setup.lua', 'Tools/Patches/**', 'RojoRHI/Tools/Patches/**') }}

      - name: Cache xmake packages
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: ${{ runner.os }}-xrepo-${{ hashFiles('xmake.lua') }}

      - name: Fetch pinned third-party deps
        run: xmake setup

      - name: Configure and generate compile_commands
        run: |
          xmake f -m release -y --ccache=n
          xmake project -k compile_commands

      - name: C++ layout policy
        run: python3 Tools/check_cpp_layout.py

      - name: Module and header contract
        run: |
          python3 Tools/check_module_deps.py
          python3 Tools/check_source_headers.py

      - name: RojoRHI source policy
        run: |
          python3 RojoRHI/Tools/check_shader_imports.py
          python3 RojoRHI/Tools/check_rhi_headers.py
          python3 RojoRHI/Tools/check_cpp_layout.py --compile-commands compile_commands.json
          python3 RojoRHI/Tools/check_cpp_comments.py --compile-commands compile_commands.json \
            --public-api-docs error

      - name: Build
        run: xmake -y

      - name: Module contract (link)
        run: python3 Tools/check_module_deps.py --link

      - name: Unit tests
        run: |
          xmake test Tests/unit
          xmake test RojoRHITests/unit

      # GitHub's hosted macOS runner exposes an Apple Paravirtual device without Metal 4.
      # Compile and inventory the suite here; run it on Metal 4 hardware before merge.
      - name: Confirm GPU suite is discoverable
        run: |
          xmake build Tests
          xmake build RojoRHITests
          gpu_count=$(./build/macosx/arm64/release/test/Tests --list-tests "[gpu]" | \
            sed -n 's/^\([0-9][0-9]*\) matching test cases$/\1/p')
          test -n "$gpu_count" && test "$gpu_count" -gt 0
          echo "$gpu_count Metal 4 GPU cases compiled in Tests"
          rhi_gpu_count=$(./build/macosx/arm64/release/rojorhi-test/RojoRHITests --list-tests "[gpu]" | \
            sed -n 's/^\([0-9][0-9]*\) matching test cases$/\1/p')
          test -n "$rhi_gpu_count" && test "$rhi_gpu_count" -gt 0
          echo "$rhi_gpu_count Metal 4 GPU cases compiled in RojoRHITests"

      - name: Checkpoint A inventory
        run: python3 Tools/check_checkpoint_a.py

      - name: Format check
        run: xmake format --check

  # Non-blocking per spec D8: reports style/modernization findings
  # without failing the build. Metal4 backend TUs are excluded from the tidy sweep below —
  # metal-cpp headers drown tidy in third-party noise; HeaderFilterRegex already keeps
  # reports scoped to our own code.
  clang-tidy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install xmake and llvm
        run: brew install xmake llvm
      - name: Cache ThirdParty
        uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake.lua', 'xmake/setup.lua', 'Tools/Patches/**', 'RojoRHI/Tools/Patches/**') }}
      - name: Cache xmake packages
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: ${{ runner.os }}-xrepo-${{ hashFiles('xmake.lua') }}
      - name: Fetch pinned third-party deps
        run: xmake setup
      - name: Configure and generate compile_commands
        run: |
          xmake f -m debug -y --ccache=n
          xmake project -k compile_commands
      - name: clang-tidy (non-blocking)
        run: |
          $(brew --prefix llvm)/bin/clang-tidy --version
          find Source -name '*.cpp' ! -path '*Metal4*' -print0 | \
            xargs -0 $(brew --prefix llvm)/bin/clang-tidy -p .
